[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-vault"
version = "0.1.0"
description = "Personal encrypted vault (notes + secrets) with agent-aware MCP access"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Secure Vault" }]
keywords = ["vault", "encryption", "notes", "secrets", "mcp", "qt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "PySide6>=6.10,<7",
  "cryptography>=44",
  "argon2-cffi>=23",
  "markdown-it-py>=3",
  "Pygments>=2.17",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3", "sqlite-vec>=0.1.6"]

[project.scripts]
secure-vault = "vault.gui:main"
secure-vault-mcp = "vault.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.ttf", "*.svg"]
